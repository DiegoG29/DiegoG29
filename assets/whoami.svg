<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
  <title id="title">DiegoG29 — profile shell</title>
  <desc id="desc">Terminal con whoami, expertise y un diagrama animado de las capas full stack.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#39C5CF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1036" height="436" rx="16" fill="#0D1117" stroke="url(#frame)" stroke-width="2"/>
  <circle cx="30" cy="34" r="6" fill="#FF7B72"/>
  <circle cx="50" cy="34" r="6" fill="#E3B341"/>
  <circle cx="70" cy="34" r="6" fill="#3FB950"/>
  <text x="98" y="39" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#7D8590">DiegoG29 · profile shell · <tspan fill="#3FB950">online</tspan></text>
  <path d="M24 58H1016" stroke="#21262D"/>

  <!-- panel izquierdo -->
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,monospace">
    <rect x="24" y="78" width="648" height="338" rx="10" fill="#111820" stroke="#3FB950" stroke-opacity=".6"/>

    <text x="46" y="122" font-size="20" font-weight="700"><tspan fill="#39C5CF">❯ whoami</tspan></text>
    <text x="46" y="158" font-size="18"><tspan fill="#E6EDF3">diego_g29</tspan><tspan fill="#7D8590">   —  </tspan><tspan fill="#E3B341" font-weight="700">Full Stack Developer</tspan></text>
    <path d="M46 182H650" stroke="#21262D"/>

    <text x="46" y="214" font-size="16"><tspan fill="#7D8590">context:</tspan><tspan x="174" fill="#D2A8FF">Web apps de punta a punta</tspan></text>
    <text x="46" y="244" font-size="16"><tspan fill="#7D8590">mission:</tspan><tspan x="174" fill="#7EE787">construir apps rápidas, limpias y mantenibles</tspan></text>

    <text x="46" y="292" font-size="20" font-weight="700" fill="#39C5CF">❯ ls expertise/</text>
    <text x="46" y="328" font-size="15"><tspan fill="#FF7B72">backend/</tspan><tspan x="226" fill="#C9D1D9">PHP · Laravel · Node.js · Python</tspan></text>
    <text x="46" y="356" font-size="15"><tspan fill="#FF7B72">frontend/</tspan><tspan x="226" fill="#C9D1D9">Blade · React · Next.js · TypeScript</tspan></text>
    <text x="46" y="384" font-size="15"><tspan fill="#FF7B72">data/</tspan><tspan x="226" fill="#C9D1D9">PostgreSQL · SQL</tspan></text>
  </g>

  <!-- panel derecho: capas full stack -->
  <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,monospace">
    <rect x="700" y="78" width="316" height="338" rx="10" fill="#111820" stroke="#3FB950" stroke-opacity=".6"/>
    <text x="726" y="116" font-size="16" fill="#E3B341">full-stack runtime</text>

    <!-- capa DB -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M858 296l88 30-88 30-88-30z" fill="#39C5CF" fill-opacity=".15" stroke="#39C5CF" stroke-width="2"/>
      <text x="858" y="330" text-anchor="middle" font-size="12" fill="#39C5CF">PostgreSQL</text>
    </g>
    <!-- capa API -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin=".4s" repeatCount="indefinite"/>
      <path d="M858 226l88 30-88 30-88-30z" fill="#3FB950" fill-opacity=".15" stroke="#3FB950" stroke-width="2"/>
      <text x="858" y="260" text-anchor="middle" font-size="12" fill="#3FB950">Laravel · Node</text>
    </g>
    <!-- capa UI -->
    <g filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" begin=".8s" repeatCount="indefinite"/>
      <path d="M858 156l88 30-88 30-88-30z" fill="#E3B341" fill-opacity=".15" stroke="#E3B341" stroke-width="2"/>
      <text x="858" y="190" text-anchor="middle" font-size="12" fill="#E3B341">Blade · React</text>
    </g>

    <text x="726" y="396" font-size="13" fill="#7D8590">status: <tspan fill="#3FB950">aprendiendo siempre</tspan></text>
  </g>
</svg>
