<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="DiegoG29 - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#e8f3f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7f37"/>
      <stop offset="1" stop-color="#0a7a8a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0000000d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="240" rx="16" fill="url(#bg)"/>
  <rect width="960" height="240" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="960" height="4" fill="url(#accent)"/>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="56" y="78" font-size="18" fill="#59636e">diego@dev:~$ ./hello --profile</text>
    <text x="56" y="140" font-size="56" font-weight="700" fill="#1f2328">DiegoG29</text>
    <text x="56" y="180" font-size="22" fill="url(#accent)" font-weight="700">Full Stack Developer</text>
    <text x="300" y="180" font-size="22" fill="#59636e">// JavaScript · TypeScript · React · Node.js</text>
    <rect x="56" y="198" width="12" height="20" fill="#1a7f37">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="96" font-weight="700" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55">
    <text x="770" y="150">&lt;/&gt;</text>
  </g>
</svg>
